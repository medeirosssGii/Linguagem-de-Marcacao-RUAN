<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Cadastro de Cliente</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <img src="img/logoo.png" alt="Logotipo da Loja TechStore">
        <h1>Crie sua Conta</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="produtos.html">Produtos</a></li>
            <li><a href="cadastro.html">Cadastro</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="quem-somos.html">Quem Somos</a></li>
        </ul>
    </nav>

    <main>
        <h2>Formulário de Cadastro Completo</h2>
        
        <!-- Formulário conforme checklist do projeto -->
        <form action="processar-cadastro.php" method="post" enctype="multipart/form-data">
            
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <p>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" minlength="5" required>
                </p>

                <p>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="telefone">Celular:</label>
                    <input type="tel" id="telefone" name="telefone" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}" title="Formato exigido: 11-99999-9999" required placeholder="11-99999-9999">
                </p>

                <p>
                    <label for="estado">Estado (UF):</label>
                    <select id="estado" name="estado">
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PR">Paraná</option>
                    </select>
                </p>
            </fieldset>

            <fieldset>
                <legend>Preferências do Usuário</legend>

                <p>Gênero:</p>
                <input type="radio" id="gen_masc" name="genero" value="Masculino">
                <label for="gen_masc">Masculino</label>

                <input type="radio" id="gen_fem" name="genero" value="Feminino">
                <label for="gen_fem">Feminino</label>

                <input type="radio" id="gen_outro" name="genero" value="Outro">
                <label for="gen_outro">Outro</label>

                <p>Áreas de Interesse em Tecnologia:</p>
                <input type="checkbox" id="int_hardware" name="interesse_hardware" value="Hardware">
                <label for="int_hardware">Hardware e Peças</label>

                <input type="checkbox" id="int_smartphones" name="interesse_smartphones" value="Smartphones">
                <label for="int_smartphones">Smartphones</label>

                <input type="checkbox" id="int_games" name="interesse_games" value="Games">
                <label for="int_games">Games e Consoles</label>
            </fieldset>

            <fieldset>
                <legend>Documentação e Comentários</legend>

                <p>
                    <label for="comprovante">Envie seu documento (PDF, PNG ou JPG):</label><br>
                    <input type="file" id="comprovante" name="comprovante" accept=".pdf, .png, .jpeg, .jpg">
                </p>

                <p>
                    <label for="mensagem">Comentários Adicionais:</label><br>
                    <textarea id="mensagem" name="mensagem" rows="5" cols="40" placeholder="Digite aqui..."></textarea>
                </p>

                <p>
                    <input type="checkbox" id="aceite_termos" name="aceite_termos" required>
                    <label for="aceite_termos">Li e aceito os termos de uso.</label>
                </p>
            </fieldset>

            <p>
                <button type="submit">Enviar Cadastro</button>
                <button type="reset">Limpar Formulário</button>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 TechStore. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
